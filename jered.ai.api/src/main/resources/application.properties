spring.application.name=jered.ai.api
spring.docker.compose.enabled=false


# ===================================================================
# CONFIGURAÇÃO DO BANCO DE DADOS H2 (PERSISTENTE)
# ===================================================================

# URL de conexão apontando para um arquivo local chamado "meubanco" na pasta do projeto
# O trecho ";DB_CLOSE_DELAY=-1" impede que o banco limpe os dados se a última conexão fechar
spring.datasource.url=jdbc:h2:file:./src/main/resources/data/buck;DB_CLOSE_DELAY=-1

# Driver do H2
spring.datasource.driverClassName=org.h2.Driver

# Usuário e senha padrão
spring.datasource.username=sa
spring.datasource.password=

# ===================================================================
# CONFIGURAÇÕES DO H2 CONSOLE (INTERFACE WEB)
# ===================================================================

# Ativa o console web para você acessar o banco pelo navegador
spring.h2.console.enabled=true

# Caminho para acessar no navegador (ex: http://localhost:8080/h2-console)
spring.h2.console.path=/h2-console

# Desabilita a proteção do frame para permitir o funcionamento da tela do console
spring.h2.console.settings.web-allow-others=false

# ===================================================================
# CONFIGURAÇÕES DO JPA / HIBERNATE
# ===================================================================

# Define o Dialect do H2 explicitamente
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ddl-auto=update: Cria as tabelas se não existirem e atualiza a estrutura sem apagar os dados antigos
spring.jpa.hibernate.ddl-auto=update

# Mostra e formata as queries SQL executadas no console para facilitar o debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true