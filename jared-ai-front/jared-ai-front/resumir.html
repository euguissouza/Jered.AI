<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <title>Resumir material – Jared.AI</title>
</head>

<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <header class="topo">
    <a class="marca" href="index.html">Jared.AI</a>
    <div class="barra-a11y" role="group" aria-label="Acessibilidade">
      <button type="button" data-a11y="menos" aria-label="Diminuir letras">A−</button>
      <button type="button" data-a11y="mais" aria-label="Aumentar letras">A+</button>
      <button type="button" data-a11y="contraste" aria-pressed="false">Alto contraste</button>
    </div>
  </header>

  <main id="conteudo" class="estreito">
    <h1>Resumir material de estudo</h1>
    <p>Aceitamos apenas arquivos PDF, até 10 MB.</p>

    <label id="zona-upload" class="zona" for="arquivo">
      <span class="zona-titulo">Arraste o arquivo até aqui</span>
      <span>ou clique para escolher no computador</span>
      <strong id="nome-arquivo"></strong>
      <input id="arquivo" class="so-leitor" type="file" accept=".pdf,application/pdf">
    </label>

    <button id="btn-resumir" class="botao" type="button" disabled>Gerar resumo</button>
    <p id="status" role="status" aria-live="polite" hidden></p>
  </main>

  <!-- Tela de carregamento / arquivo gerado -->
  <div id="tela-status" class="tela" role="dialog" aria-modal="true" aria-labelledby="tela-titulo" tabindex="-1" hidden>
    <div class="tela-caixa">
      <div id="indicador" class="loader" aria-hidden="true"></div>
      <h2 id="tela-titulo">Gerando resumo</h2>
      <p id="tela-texto">Isso pode levar alguns instantes. Por favor, aguarde.</p>
      <button id="btn-novamente" class="botao" type="button" hidden>Resumir novamente</button>
    </div>
  </div>

  <footer class="rodape">
    <p>Jared.AI · Projeto extensionista</p>
  </footer>

  <script type="module" src="js/acessibilidade.js"></script>

  <script>
    const URL_POST = 'http://localhost:8080/api/jered/post';

    const inputArquivo   = document.getElementById('arquivo');
    const btnResumir     = document.getElementById('btn-resumir');
    const nomeArquivo    = document.getElementById('nome-arquivo');
    const statusTexto    = document.getElementById('status');
    const tela           = document.getElementById('tela-status');
    const indicador      = document.getElementById('indicador');
    const telaTitulo     = document.getElementById('tela-titulo');
    const telaTexto      = document.getElementById('tela-texto');
    const btnNovamente   = document.getElementById('btn-novamente');

    function mostrarErro(msg) {
      statusTexto.hidden = false;
      statusTexto.dataset.tipo = 'erro';
      statusTexto.textContent = msg;
    }

    function telaGerando() {
      indicador.className = 'loader';
      telaTitulo.textContent = 'Gerando resumo';
      telaTexto.textContent = 'Isso pode levar alguns instantes. Por favor, aguarde.';
      btnNovamente.hidden = true;
      tela.hidden = false;
      tela.focus();
    }

    function telaGerado() {
      indicador.className = 'check';
      indicador.textContent = '✓';
      telaTitulo.textContent = 'Arquivo gerado';
      telaTexto.textContent = 'Seu resumo foi criado com sucesso.';
      btnNovamente.hidden = false;
      btnNovamente.focus();
    }

    function reiniciar() {
      inputArquivo.value = '';
      nomeArquivo.textContent = '';
      btnResumir.disabled = true;
      statusTexto.hidden = true;
      indicador.textContent = '';
      tela.hidden = true;
      inputArquivo.focus();
    }

    inputArquivo.addEventListener('change', () => {
      const arquivo = inputArquivo.files[0];
      statusTexto.hidden = true;

      if (!arquivo) {
        btnResumir.disabled = true;
        nomeArquivo.textContent = '';
        return;
      }

      const ehPdf = arquivo.type === 'application/pdf' || arquivo.name.toLowerCase().endsWith('.pdf');
      if (!ehPdf) {
        inputArquivo.value = '';
        btnResumir.disabled = true;
        nomeArquivo.textContent = '';
        mostrarErro('Envie apenas arquivos em formato PDF.');
        return;
      }

      btnResumir.disabled = false;
      nomeArquivo.textContent = arquivo.name;
    });

    btnResumir.addEventListener('click', async () => {
      const arquivo = inputArquivo.files[0];
      if (!arquivo) return;

      btnResumir.disabled = true;
      statusTexto.hidden = true;
      telaGerando();

      const formData = new FormData();
      formData.append('file', arquivo); // nome do @RequestParam no Spring

      try {
        // O fetch segue automaticamente o redirect da API até /api/jered/download
        const resposta = await fetch(URL_POST, { method: 'POST', body: formData });

        if (!resposta.ok) {
          throw new Error(`Erro de comunicação: ${resposta.status}`);
        }

        // Não precisamos ler o corpo do arquivo, só confirmar que chegou ao download
        if (resposta.body) resposta.body.cancel();

        telaGerado();
      } catch (erro) {
        console.error('Falha ao comunicar com a API:', erro);
        tela.hidden = true;
        mostrarErro('Ocorreu um erro ao gerar o resumo. Verifique se o servidor backend está ligado.');
        btnResumir.disabled = false;
      }
    });

    btnNovamente.addEventListener('click', reiniciar);
  </script>
</body>

</html>
